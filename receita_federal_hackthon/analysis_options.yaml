name: receita_federal_hackthon
description: Um app Flutter criado para o hackathon da Receita Federal
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.1.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Pacotes usados no seu main.dart
  shared_preferences: ^2.2.2
  contacts_service: ^0.6.3
  permission_handler: ^11.3.1

  # Outros pacotes úteis
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
